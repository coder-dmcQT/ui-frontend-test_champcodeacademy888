# Next.js 项目构建并部署到 GitHub Pages（输出目录为 dist）
name: Deploy Next.js to GitHub Pages

# 触发条件：推送到 main/master 分支 或 手动触发
on:
  push:
    branches: ["master"]  # 若你的主分支是 main，改为 ["main"]
  workflow_dispatch:

# 权限配置：最小必要权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：避免重复部署，不中断正在运行的部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 第一步：构建 Next.js 项目（输出到 dist 目录）
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Node.js（适配 Next.js 推荐版本）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"  # Next.js 14+ 推荐 20.x
          cache: "npm"        # 缓存 npm 依赖（用 yarn 则改为 yarn）

      # 4. 恢复 Next.js 构建缓存（加速二次构建）
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # 5. 安装项目依赖
      - name: Install dependencies
        run: npm install  # 已切换为 npm，无需修改

      # 6. 构建 Next.js 项目（输出到 dist 目录）
      - name: Build Next.js project
        run: npm run build:inner  # 需确保 package.json 中配置了该脚本

      # 7. 上传 dist 目录作为部署产物
      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # 部署目录保持为 dist
      # 在 Build Next.js project 步骤后添加：
      # 在 Build Next.js project 步骤后添加：
      - name: Check generated files
        run: |
          echo "current dir: "
          ls -la

  # 第二步：部署到 GitHub Pages
  deploy:
    needs: build  # 依赖 build 任务完成
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 部署 dist 目录到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
